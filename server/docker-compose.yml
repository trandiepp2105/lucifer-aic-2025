version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: lucifer-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY}
      - MEILI_ENV=production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - lucifer-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lucifer-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Meilisearch Configuration
      - MEILISEARCH_HOST=meilisearch
      - MEILISEARCH_PORT=${MEILISEARCH_PORT}
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      - MEILISEARCH_LIMIT_SEARCH=${MEILISEARCH_LIMIT_SEARCH}
      
      # Dataset Paths (mount your data volumes and update paths)
      - OCR_DATASETS=${OCR_DATASETS}
      - SUBTITLE_DATASETS=${SUBTITLE_DATASETS}
      
      # Device Configuration
      - DEVICE_0=${DEVICE_0}
      - DEVICE_1=${DEVICE_1}
      - USE_GPU=${USE_GPU}
      
      # Model 1 Configuration
      - MODEL_1_NAME=${MODEL_1_NAME}
      - MODEL_1_WEIGHT=${MODEL_1_WEIGHT}
      - MODEL_1_PRETRAINED=${MODEL_1_PRETRAINED}
      - MODEL_1_EMBEDDING_PATH=${MODEL_1_EMBEDDING_PATH}
      - MODEL_1_INDEX_TYPE=${MODEL_1_INDEX_TYPE}
      - MODEL_1_INPUT_INDEX_PATH=${MODEL_1_INPUT_INDEX_PATH}
      - MODEL_1_OUTPUT_INDEX_PATH=${MODEL_1_OUTPUT_INDEX_PATH}
      
      # Model 2 Configuration
      - MODEL_2_NAME=${MODEL_2_NAME}
      - MODEL_2_WEIGHT=${MODEL_2_WEIGHT}
      - MODEL_2_PRETRAINED=${MODEL_2_PRETRAINED}
      - MODEL_2_EMBEDDING_PATH=${MODEL_2_EMBEDDING_PATH}
      - MODEL_2_INDEX_TYPE=${MODEL_2_INDEX_TYPE}
      - MODEL_2_INPUT_INDEX_PATH=${MODEL_2_INPUT_INDEX_PATH}
      - MODEL_2_OUTPUT_INDEX_PATH=${MODEL_2_OUTPUT_INDEX_PATH}
      
      # FAISS Configuration
      - FAISS_USE_GPU=${FAISS_USE_GPU}
      - FAISS_NPROBE=${FAISS_NPROBE}
      - FAISS_NLIST=${FAISS_NLIST}
      
      # API Configuration
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - API_WORKERS=${API_WORKERS}
      
      # Search Defaults
      - DEFAULT_TOP_K=${DEFAULT_TOP_K}
      - DEFAULT_TEMPORAL_TIME=${DEFAULT_TEMPORAL_TIME}
      - DEFAULT_INITIAL_SEARCH_K=${DEFAULT_INITIAL_SEARCH_K}

      # Fusion Weights
      - WEIGHT_TEXT=${WEIGHT_TEXT}
      - WEIGHT_OCR=${WEIGHT_OCR}
      - WEIGHT_SUBTITLE=${WEIGHT_SUBTITLE}
      - WEIGHT_IMAGE=${WEIGHT_IMAGE}
      
    volumes:
      - /lucifer_data:/lucifer_data:ro  # Read-only data
    depends_on:
      meilisearch:
        condition: service_healthy
    networks:
      - lucifer-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  # Use all available GPUs
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  meilisearch_data:
    driver: local

networks:
  lucifer-network:
    driver: bridge
