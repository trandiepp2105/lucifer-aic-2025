version: '3.8'

services:
  agentic-rag:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SEARCH_API_URL=${SEARCH_API_URL}
      - MEDIA_API_URL=${MEDIA_API_URL}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-pro-vision}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.1}
      - DEBUG=${DEBUG:-false}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
