upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost 10.147.20.156;
    client_max_body_size 100M;

    # API endpoints - proxy to backend
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle WebSocket connections if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Admin interface - proxy to backend  
    location /admin/ {
        proxy_pass http://backend/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/cframes/ {
        alias /media/cframes/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By nginx;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        
        # Handle CORS if needed
        add_header Access-Control-Allow-Origin *;
        
        # Disable autoindex for security
        autoindex off;
        
        # Try to serve file, return 404 if not found
        try_files $uri =404;
    }

    # Serve generated video clips from backend
    location /media/video_clips/ {
        proxy_pass http://backend/media/video_clips/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache settings for video clips
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Served-By nginx-proxy;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        
        # CORS headers for video streaming
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD';
        add_header Access-Control-Allow-Headers 'Range, Content-Range, Content-Length, Accept-Ranges';
        add_header Access-Control-Expose-Headers 'Content-Length, Content-Range, Accept-Ranges';
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD';
            add_header Access-Control-Allow-Headers 'Range, Content-Range, Content-Length, Accept-Ranges';
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type text/plain;
            add_header Content-Length 0;
            return 204;
        }
        
        # Enable range requests for video streaming
        add_header Accept-Ranges bytes;
    }

    # Serve HLS videos directly from filesystem (alternative path)
    location /media/videos_hls/ {
        alias /media/videos_hls/;
        
        # Handle preflight OPTIONS requests first
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, Range, Content-Range, Content-Length, Accept-Ranges, Authorization, Content-Type, X-Requested-With';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        # CORS headers for actual requests
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Range, Content-Range, Content-Length, Accept-Ranges, Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
        
        # General settings
        expires 10m;
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Served-By nginx always;
        add_header X-Content-Type-Options nosniff always;
        
        # Specific MIME types for HLS files
        location ~* \.m3u8$ {
            add_header 'Content-Type' 'application/vnd.apple.mpegurl' always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Content-Range, Content-Length, Accept-Ranges, Authorization, Content-Type' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
            expires 5s;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma no-cache always;
        }
        
        location ~* \.ts$ {
            add_header 'Content-Type' 'video/mp2t' always;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Content-Range, Content-Length, Accept-Ranges, Authorization, Content-Type' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
        }
        
        # Enable range requests for video streaming
        add_header Accept-Ranges bytes always;
        
        # Disable autoindex for security
        autoindex off;
        
        # Try to serve file, return 404 if not found
        try_files $uri =404;
    }

    # Proxy frontend static files (CSS, JS, etc.) to frontend container
    location /static/ {
        proxy_pass http://frontend/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache settings for static assets
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By nginx-proxy;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        
        # Handle CORS if needed
        add_header Access-Control-Allow-Origin *;
    }

    # Serve Django static files (admin, DRF, etc.)
    location /staticfiles/ {
        alias /backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Served-By nginx;
    }

    location /media/queries/ {
        proxy_pass http://backend/media/queries/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache settings
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Served-By nginx-proxy;
        
        # Security headers
        add_header X-Content-Type-Options nosniff;
        
        # Handle CORS if needed
        add_header Access-Control-Allow-Origin *;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Frontend application
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle WebSocket connections for React dev server
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
