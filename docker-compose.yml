services:
  mysql:
    image: mysql:8.0
    container_name: aic_mysql
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - aic_network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 10s

  redis:
    image: redis:7-alpine
    container_name: aic_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aic_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      timeout: 10s
      retries: 5
      interval: 10s

  # meilisearch:
  #   image: getmeili/meilisearch:v1.5
  #   container_name: aic_meilisearch
  #   restart: unless-stopped
  #   environment:
  #     - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
  #     - MEILI_NO_ANALYTICS=true
  #     - MEILI_ENV=production
  #     - MEILI_LOG_LEVEL=INFO
  #     - MEILI_DB_PATH=/meili_data
  #     - MEILI_MAX_INDEXING_MEMORY=4GiB
  #     - MEILI_MAX_INDEXING_THREADS=4
  #   mem_limit: 10g          # Increase memory limit for better caching
  #   memswap_limit: 10g      # Increase swap limit  
  #   shm_size: 4g            # Add shared memory for faster operations
  #   ports:
  #     - "7700:7700"
  #   volumes:
  #     - meilisearch_data:/meili_data
  #   networks:
  #     - aic_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5

  frontend:
    build: ./frontend
    container_name: aic_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - REACT_APP_API_ENDPOINT=/api
    networks:
      - aic_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: aic_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/staticfiles:/backend/staticfiles:ro
      # - ${CFRAMES_PATH}:/media/cframes:ro
      # - ${VIDEOS_HLS_PATH}:/media/videos_hls:ro
      - type: bind
        source: ${CFRAMES_PATH}
        target: /media/cframes
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate
      - type: bind  
        source: ${VIDEOS_HLS_PATH}
        target: /media/videos_hls
        read_only: true
        bind:
          create_host_path: false
          propagation: rprivate 
    depends_on:
      - backend
      - frontend
    networks:
      - aic_network
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  backend:
    build: ./backend
    container_name: aic_backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./backend:/backend
    environment:
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MEILISEARCH_HOST=meilisearch
      - MEILISEARCH_PORT=7700
      - MEILISEARCH_API_KEY=${MEILI_MASTER_KEY:-masterKey}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SERVER_TYPE=uvicorn
      - HOST=${HOST}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # meilisearch:
      #   condition: service_healthy
    networks:
      - aic_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  # meilisearch_data:
  #   driver: local

networks:
  aic_network:
    driver: bridge
